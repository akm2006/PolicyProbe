name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/ats-bond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixtures/ats-bond/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
