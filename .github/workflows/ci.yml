name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/ats-bond
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixtures/ats-bond/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: akm2006/hedera-harness
          ref: feat/deterministic-onchain-postconditions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack --dry-run
      - run: corepack enable
      - run: npm run smoke:pack

  harness-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: akm2006/hedera-harness
          ref: feat/deterministic-onchain-postconditions
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
