  </pattern>
  <radialGradient id="fl-fade" cx="50%" cy="50%" r="65%">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="fl-mask"><rect width="1280" height="300" fill="url(#fl-fade)"/></mask>
  <radialGradient id="fl-glow">
    <stop offset="0" stop-color="#734AF9" stop-opacity="0.32"/><stop offset="1" stop-color="#734AF9" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#fl-frame)">
  <rect width="1280" height="300" fill="#0c0a09"/>
  <rect width="1280" height="300" fill="url(#fl-dots)" mask="url(#fl-mask)"/>
  
</g>
