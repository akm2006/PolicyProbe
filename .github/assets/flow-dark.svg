<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" fill="none" role="img" aria-label="How a PolicyProbe assertion reaches a verdict">
<title>How a PolicyProbe assertion reaches a verdict</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; }
  .flow { stroke-dasharray: 3 7; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>

<defs>
  <clipPath id="fl-frame"><rect width="1280" height="300" rx="20"/></clipPath>
  <pattern id="fl-dots" width="22" height="22" patternUnits="userSpaceOnUse">
