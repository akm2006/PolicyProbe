<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="180" viewBox="0 0 1280 180" fill="none" role="img" aria-label="PolicyProbe by the numbers">
<title>PolicyProbe by the numbers</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; }
  .flow { stroke-dasharray: 3 7; animation: flow 1.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -20; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>

<defs>
  <clipPath id="st-frame"><rect width="1280" height="180" rx="20"/></clipPath>
  <pattern id="st-dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
  </pattern>
  <radialGradient id="st-fade" cx="50%" cy="50%" r="65%">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="st-mask"><rect width="1280" height="180" fill="url(#st-fade)"/></mask>
  <radialGradient id="st-glow">
    <stop offset="0" stop-color="#734AF9" stop-opacity="0.32"/><stop offset="1" stop-color="#734AF9" stop-opacity="0"/>
  </radialGradient>
</defs>
<g clip-path="url(#st-frame)">
  <rect width="1280" height="180" fill="#0c0a09"/>
  <rect width="1280" height="180" fill="url(#st-dots)" mask="url(#st-mask)"/>
  
</g>
<rect x="0.5" y="0.5" width="1279" height="179" rx="19.5" stroke="#292524"/>
<text x="160" y="84" text-anchor="middle" class="sans" font-size="50" font-weight="650" letter-spacing="-1.5" fill="#faf9f6">6<tspan fill="#77706a">/6</tspan></text>
<text x="160" y="116" text-anchor="middle" class="sans" font-size="15" font-weight="500" fill="#faf9f6">policies passed on testnet</text>
<text x="160" y="140" text-anchor="middle" class="mono" font-size="12" fill="#77706a">ATS bond · Mirror Node evidence</text><line x1="320" y1="44" x2="320" y2="136" stroke="#292524"/>
<text x="480" y="84" text-anchor="middle" class="sans" font-size="50" font-weight="650" letter-spacing="-1.5" fill="#faf9f6">+82<tspan fill="#77706a"></tspan></text>
<text x="480" y="116" text-anchor="middle" class="sans" font-size="15" font-weight="500" fill="#faf9f6">Harness tests added</text>
<text x="480" y="140" text-anchor="middle" class="mono" font-size="12" fill="#77706a">195 → 277 in the full suite</text><line x1="640" y1="44" x2="640" y2="136" stroke="#292524"/>
<text x="800" y="84" text-anchor="middle" class="sans" font-size="50" font-weight="650" letter-spacing="-1.5" fill="#faf9f6">2<tspan fill="#77706a"></tspan></text>
<text x="800" y="116" text-anchor="middle" class="sans" font-size="15" font-weight="500" fill="#faf9f6">assertion families</text>
<text x="800" y="140" text-anchor="middle" class="mono" font-size="12" fill="#77706a">outcome · balance delta</text><line x1="960" y1="44" x2="960" y2="136" stroke="#292524"/>
<text x="1120" y="84" text-anchor="middle" class="sans" font-size="50" font-weight="650" letter-spacing="-1.5" fill="#faf9f6">~6<tspan fill="#77706a"></tspan></text>
<text x="1120" y="116" text-anchor="middle" class="sans" font-size="15" font-weight="500" fill="#faf9f6">recipe lines per assertion</text>
<text x="1120" y="140" text-anchor="middle" class="mono" font-size="12" fill="#77706a">the engine owns the rest</text>
</svg>
