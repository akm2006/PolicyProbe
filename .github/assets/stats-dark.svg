<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="180" viewBox="0 0 1280 180" fill="none" role="img" aria-label="PolicyProbe by the numbers">
<title>PolicyProbe by the numbers</title>
<style>
  @font-face { font-family: 'PP Sans'; font-weight: 400 700; src: url(data:font/woff2;base64,) format('woff2'); }
  @font-face { font-family: 'PP Mono'; font-weight: 400 700; src: url(data:font/woff2;base64,) format('woff2'); }
  .sans { font-family: 'PP Sans', 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'PP Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .dash { stroke-dasharray: 3 6; animation: dash 1.2s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -18; } }
  .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<defs>
  <clipPath id="st-frame"><rect width="1280" height="180" rx="6"/></clipPath>
  <pattern id="st-stripes" width="41" height="41" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect x="40" width="1" height="41" fill="#f2f2ef" fill-opacity="0.05"/>
  </pattern>
  <filter id="st-noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
  </filter>
</defs>
<g clip-path="url(#st-frame)">
  <rect width="1280" height="180" fill="#0b0a09"/>
  <path d="M0 22.5H1280M0 45H1280M0 67.5H1280M0 90H1280M0 112.5H1280M0 135H1280M0 157.5H1280M106.7 0V180M213.3 0V180M320 0V180M426.7 0V180M533.3 0V180M640 0V180M746.7 0V180M853.3 0V180M960 0V180M1066.7 0V180M1173.3 0V180" stroke="#f2f2ef" stroke-opacity="0.05"/>
  <rect width="1280" height="180" filter="url(#st-noise)" opacity="0.03"/>
  
</g>
<rect x="0.5" y="0.5" width="1279" height="179" rx="5.5" stroke="#232322"/>
<text x="56" y="100" class="sans" font-size="64" letter-spacing="-1.6" fill="#f2f2ef">6/6</text>
<text x="56" y="136" class="mono" font-size="13.5" fill="#a39d98">ATS policies verified</text>
<text x="348" y="100" class="sans" font-size="64" letter-spacing="-1.6" fill="#f2f2ef">+82</text>
<text x="348" y="136" class="mono" font-size="13.5" fill="#a39d98">Harness tests · 277 total</text>
<text x="640" y="100" class="sans" font-size="64" letter-spacing="-1.6" fill="#f2f2ef">2</text>
<text x="640" y="136" class="mono" font-size="13.5" fill="#a39d98">assertion families</text>
<text x="932" y="100" class="sans" font-size="64" letter-spacing="-1.6" fill="#f2f2ef">~6</text>
<text x="932" y="136" class="mono" font-size="13.5" fill="#a39d98">recipe lines per assertion</text>
</svg>
